<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bizim 1. Yılımız</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="container">
<header>
<h1>Bizim 1. Yılımız 💖</h1>
<p class="subtitle">Sana özel küçük bir sürpriz...</p>
</header>


<section id="hero">
<img id="coverPhoto" src="assets/cover.jpg" alt="Bizim Fotoğraf" onerror="this.style.display='none'">
<div class="card">
<h2>Sevgilim,</h2>
<p id="loveText">Seninle geçen her saniye bir hediye. Daha nice yıllara birlikte...</p>
<button id="readMoreBtn">Daha fazlasını oku</button>
</div>
</section>


<section id="messages" class="hidden">
<h3>Özel Mesajlar</h3>
<div id="messagesList"></div>
<form id="messageForm">
<input type="text" id="name" placeholder="Adın" required>
<input type="text" id="message" placeholder="Kısa bir not" required>
<button type="submit">Gönder</button>
</form>
</section>


<footer>
<small>Bu sayfa <span id="dateSpan"></span> için hazırlandı.</small>
</footer>
</main>


<script src="script.js"></script>
</body>
</html>
